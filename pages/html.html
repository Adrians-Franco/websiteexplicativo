  <main>
    <p>O HTML é a base de toda página web. Ele define o conteúdo e a estrutura.</p>

    <h2>Exemplo:</h2>
    <pre>
&lt;h1&gt;Olá, mundo!&lt;/h1&gt;
&lt;p&gt;Este é o meu primeiro site.&lt;/p&gt;
    </pre>

    <h3>Resultado:</h3>
    <div class="exemplo">
      <h1>Olá, mundo!</h1>
      <p>Este é o meu primeiro site.</p>
    </div>
